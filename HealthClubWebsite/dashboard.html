
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Members' Dashboard | Health Club - Comboni</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="dashboard-login">

    <div class="login-card">

      <div class="login-symbol">✚</div>

      <p class="eyebrow">HEALTH CLUB - COMBONI</p>

      <h1>Members' Dashboard</h1>

      <p>
        Welcome! Please enter your details to access
        the private Health Club dashboard.
      </p>

      <form id="dashboard-login-form">

        <label for="member-name">Your full name</label>

        <input
          type="text"
          id="member-name"
          placeholder="Enter your full name"
          required
        >

        <label for="dashboard-password">Password</label>

        <input
          type="password"
          id="dashboard-password"
          placeholder="Enter your password"
          required
        >

        <button type="submit">Continue</button>

        <p id="login-message"></p>

      </form>

      <a href="index.html" class="back-link">
        ← Back to the main website
      </a>

    </div>

  </main>

</body>
</html>
